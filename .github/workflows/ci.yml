name: Compilar y probar

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Configurar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: scripts/datos-de-referencia/.node-version
          cache: npm
          cache-dependency-path: scripts/datos-de-referencia/package-lock.json

      - name: Probar generador de datos de referencia
        working-directory: scripts/datos-de-referencia
        run: |
          npm ci
          npm test

      # El runner de Ubuntu trae Docker para los tests de integración con Testcontainers.
      - name: Verificar Docker
        run: docker info

      - name: Restaurar
        run: dotnet restore ArquitecturaBaseMultitenant.slnx

      - name: Compilar
        run: dotnet build ArquitecturaBaseMultitenant.slnx --configuration Release --no-restore

      - name: Verificar contrato OpenAPI versionado
        run: |
          test -f docs/contracts/openapi.json
          git diff --exit-code -- docs/contracts/openapi.json

      - name: Probar
        run: dotnet test --solution ArquitecturaBaseMultitenant.slnx --configuration Release --no-build
